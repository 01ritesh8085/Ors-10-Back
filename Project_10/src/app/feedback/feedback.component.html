<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 12%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">

          <form name="feedbackForm">

            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold text-center">
              Add Feedback
            </h2>

            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold text-center">
              Update Feedback
            </h2>

            <!-- Messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <div *ngIf="!form.error && form.message" class="alert alert-success alert-dismissible fade show">
              <button type="button" class="close" data-dismiss="alert">&times;</button>
              {{ form.message }}
            </div>

            <!-- Feedback Form Id -->
            <div class="form-group pt-2">
              <label><b>Feedback Form ID</b><span class="required-field">*</span></label>
              <input type="number" name="feedbackFormId" [(ngModel)]="form.data.feedbackFormId"
                class="form-control" placeholder="Enter Feedback ID">

              <span *ngIf="form.inputerror.feedbackFormId" class="alertRedColor">
                {{ form.inputerror.feedbackFormId }}
              </span>
            </div>

            <!-- Participant Name -->
            <div class="form-group pt-2">
              <label><b>Participant Name</b><span class="required-field">*</span></label>
              <input type="text" name="participantName" [(ngModel)]="form.data.participantName"
                class="form-control" placeholder="Enter Name">

              <span *ngIf="form.inputerror.participantName" class="alertRedColor">
                {{ form.inputerror.participantName }}
              </span>
            </div>

            <!-- Rating -->
            <div class="form-group pt-2">
              <label><b>Rating</b><span class="required-field">*</span></label>
              <select class="form-control" name="rating" [(ngModel)]="form.data.rating">
                <option [ngValue]="undefined">Select Rating</option>

                <option *ngFor="let r of form.preload.ratingList | keyvalue" [value]="r.key">
                  {{ r.value }}
                </option>
              </select>

              <span *ngIf="form.inputerror.rating" class="alertRedColor">
                {{ form.inputerror.rating }}
              </span>
            </div>

            <!-- Comments -->
            <div class="form-group pt-2">
              <label><b>Comments</b><span class="required-field">*</span></label>
              <textarea name="comments" [(ngModel)]="form.data.comments"
                class="form-control" placeholder="Enter Comments"></textarea>

              <span *ngIf="form.inputerror.comments" class="alertRedColor">
                {{ form.inputerror.comments }}
              </span>
            </div>

            <!-- Buttons -->
            <div class="row pt-2 pl-2 pb-3">

              <div class="col-md-3"></div>

              <div class="pt-2">
                <button *ngIf="!form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  Save
                </button>
              </div>

              <div class="col-md-1"></div>

              <div class="pt-2">
                <button *ngIf="form.data.id > 0" (click)="submit()" class="btn btn-success mr-2">
                  Update
                </button>
              </div>

              <div class="pt-2">
                <a class="btn btn-warning mr-1" [routerLink]="['/feedbacklist']"
                  style="color:white;text-decoration:none">
                  List
                </a>
              </div>

            </div>

          </form>

        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
