<app-navbar></app-navbar>

<div class="content-wrapper" style="padding-top: 7%;padding-bottom: 8%; 
background: url(assets/files/pexels-pixabay-326333.jpg) no-repeat center center;
background-attachment: fixed;
background-size: cover;width:auto;height: 90vh;">

  <div class="container-fluid">

    <div class="panel panel-primary">

      <div class="panel-heading" style="height: 50px;">
        <div class="text-center">
          <h1 class="text-white font-weight-bold">{{'Parking List' | translate}}</h1>
        </div>
      </div>

      <!-- 🔍 Search Section -->
      <div class="row pt-4 pb-4" style="margin-left:15%">

        <div class="col-sm-3">
          <input type="text" class="form-control"
                 [(ngModel)]="form.searchParams.location"
                 placeholder="Search location">
        </div>

        <div class="col-sm-1 ml-3">
          <button (click)="submit()" class="btn btn-primary">
            {{'Search'| translate}}
          </button>
        </div>

        <div class="col-sm-2 ml-3">
          <button (click)="forward('/parking')" class="btn btn-success">
            {{'Add Parking'| translate}}
          </button>
        </div>

        <div class="col-sm-1 ml-3">
          <button (click)="deleteMany()" class="btn btn-danger">
            {{'Delete'| translate}}
          </button>
        </div>

      </div>

      <!-- Messages -->
      <div *ngIf="form.error" class="alert alert-danger">
        {{form.message}}
      </div>

      <div *ngIf="!form.error && form.message" class="alert alert-success">
        {{form.message}}
      </div>

      <!-- 📊 Table -->
      <div class="p-1">
        <div class="table-responsive">
          <table class="table table-bordered table-striped table-hover font-weight-bold text-white">

            <thead class="thead-light text-uppercase">
              <tr align="center">
                <th><input type="checkbox" [(ngModel)]="isMasterSel"
                           (change)="checkUncheckAll($event)" /></th>

                <th>S.No</th>
                <th>Location</th>
                <th>Capacity</th>
                <th>Fee</th>
                <th>Edit</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let m of form.list; let i = index" align="center">

                <td>
                  <input type="checkbox"
                         (change)="checklistUpdate()"
                         id="{{m.id}}" />
                </td>

                <td>{{(form.pageNo*5)+i+1}}</td>
                <td>{{m.location}}</td>
                <td>{{m.capacity}}</td>
                <td>{{m.fee}}</td>

                <td>
                  <a (click)="forward('/parking/' + m.id)" style="cursor:pointer;">
                    <i class="fa fa-edit text-info"></i>
                  </a>
                </td>

              </tr>
            </tbody>

          </table>
        </div>

        <!-- Pagination -->
        <table style="width: 100%;">
          <tr>

            <td style="width: 50%;">
              <button (click)="previous()" [disabled]="form.pageNo == 0"
                      class="btn btn-info">
                Previous
              </button>
            </td>

            <td>
              <a class="btn btn-warning"
                 [routerLink]="['/parkinglist']"
                 (click)="exit()">
                Reset
              </a>
            </td>

            <td>
              <button (click)="next()" [disabled]="nextList==0"
                      class="btn btn-info">
                Next
              </button>
            </td>

          </tr>
        </table>

      </div>

    </div>
  </div>

</div>

<app-footer></app-footer>
