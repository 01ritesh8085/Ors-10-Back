<app-navbar></app-navbar>

<style>
  .grad {
    background-image: linear-gradient(to bottom right, rgb(32, 168, 168), rgb(219, 231, 237));
    background-repeat: no-repeat;
    background-size: 100%;
    padding-bottom: 25px;
  }

  .background {
    padding-top: 3%;
    padding-bottom: 13%;
    background: url('assets/files/wall.jpg') no-repeat center center;
    background-attachment: fixed;
    background-size: cover;
    width: 100%;
    height: auto;
  }

  .required-field {
    color: red;
  }

  .alertRedColor {
    color: red;
  }
</style>

<div class="container-fluid background" style="padding-top: 8%">
  <div class="row justify-content-center">
    <div class="col-sm-8 col-md-6 col-lg-4">
      <div class="card">
        <div class="card-body shadow-lg grad">
          <form name="parkingForm">

            <h2 *ngIf="!form.data.id" class="text-primary font-weight-bold text-center">
              {{ 'Add Parking' | translate }}
            </h2>

            <h2 *ngIf="form.data.id" class="text-primary font-weight-bold text-center">
              {{ 'Update Parking' | translate }}
            </h2>

            <!-- Messages -->
            <div *ngIf="form.error && form.message" class="alert alert-danger">
              {{ form.message }}
            </div>

            <div *ngIf="!form.error && form.message" class="alert alert-success">
              {{ form.message }}
            </div>

            <!-- Location -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Location' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <input type="text" name="location"
                     [(ngModel)]="form.data.location"
                     class="form-control"
                     placeholder="Enter location">

              <span *ngIf="form.inputerror.location" class="alertRedColor">
                {{ form.inputerror.location }}
              </span>
            </div>

            <!-- Capacity -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Capacity' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <input type="number" name="capacity"
                     [(ngModel)]="form.data.capacity"
                     class="form-control"
                     placeholder="Enter capacity">

              <span *ngIf="form.inputerror.capacity" class="alertRedColor">
                {{ form.inputerror.capacity }}
              </span>
            </div>

            <!-- Fee -->
            <div class="form-group pt-2">
              <label>
                <b>{{ 'Fee' | translate }}</b>
                <span class="required-field">*</span>
              </label>

              <input type="number" name="fee"
                     [(ngModel)]="form.data.fee"
                     class="form-control"
                     placeholder="Enter fee">

              <span *ngIf="form.inputerror.fee" class="alertRedColor">
                {{ form.inputerror.fee }}
              </span>
            </div>

            <!-- Buttons -->
            <div class="row pt-3">

              <div class="col-md-3"></div>

              <div>
                <button *ngIf="!form.data.id" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Save' | translate }}
                </button>
              </div>

              <div>
                <button *ngIf="form.data.id" (click)="submit()" class="btn btn-success mr-2">
                  {{ 'Update' | translate }}
                </button>
              </div>

              <div>
                <a class="btn btn-warning"
                   [routerLink]="['/parkinglist']">
                  {{ 'List' | translate }}
                </a>
              </div>

            </div>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
